<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">DemoAgent five-guide workflow</title><desc id="desc">Understand the project and clarify the goal, plan a storyboard, execute while capturing evidence, verify outcomes, and compose an inspectable demo package. Conceptual workflow, not a screenshot or proof of a completed run.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6856ba" stroke-width="1.5"/></marker></defs><rect width="1200" height="440" rx="24" fill="#f4f1fa"/><g font-family="Arial, sans-serif"><text x="44" y="49" fill="#6856ba" font-size="14" font-weight="700" letter-spacing="3">DEMOAGENT / EVIDENCE-FIRST WORKFLOW</text><text x="44" y="99" fill="#26213d" font-size="32" font-weight="700">The video is one artifact. The evidence is the story.</text><text x="44" y="132" fill="#656079" font-size="17">Five practical guides, from project understanding to a reproducible handoff.</text><rect x="44" y="181" width="208" height="132" rx="14" fill="#fff" stroke="#dcd4ec"/><circle cx="73" cy="210" r="15" fill="#ece6f7"/><text x="73" y="215" text-anchor="middle" fill="#6856ba" font-size="12" font-weight="700">01</text><text x="60" y="253" fill="#26213d" font-size="23" font-weight="700">Understand</text><text x="60" y="280" fill="#656079" font-size="12">Project + viewer goal</text><path d="M255 246H268" stroke="#6856ba" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="270" y="181" width="208" height="132" rx="14" fill="#fff" stroke="#dcd4ec"/><circle cx="299" cy="210" r="15" fill="#ece6f7"/><text x="299" y="215" text-anchor="middle" fill="#6856ba" font-size="12" font-weight="700">02</text><text x="286" y="253" fill="#26213d" font-size="23" font-weight="700">Plan</text><text x="286" y="280" fill="#656079" font-size="12">Storyboard + expected result</text><path d="M481 246H494" stroke="#6856ba" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="496" y="181" width="208" height="132" rx="14" fill="#fff" stroke="#dcd4ec"/><circle cx="525" cy="210" r="15" fill="#ece6f7"/><text x="525" y="215" text-anchor="middle" fill="#6856ba" font-size="12" font-weight="700">03</text><text x="512" y="253" fill="#26213d" font-size="23" font-weight="700">Execute</text><text x="512" y="280" fill="#656079" font-size="12">Run + capture evidence</text><path d="M707 246H720" stroke="#6856ba" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="722" y="181" width="208" height="132" rx="14" fill="#fff" stroke="#dcd4ec"/><circle cx="751" cy="210" r="15" fill="#ece6f7"/><text x="751" y="215" text-anchor="middle" fill="#6856ba" font-size="12" font-weight="700">04</text><text x="738" y="253" fill="#26213d" font-size="23" font-weight="700">Verify</text><text x="738" y="280" fill="#656079" font-size="12">Observed vs. expected</text><path d="M933 246H946" stroke="#6856ba" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="948" y="181" width="208" height="132" rx="14" fill="#fff" stroke="#dcd4ec"/><circle cx="977" cy="210" r="15" fill="#ece6f7"/><text x="977" y="215" text-anchor="middle" fill="#6856ba" font-size="12" font-weight="700">05</text><text x="964" y="253" fill="#26213d" font-size="23" font-weight="700">Compose</text><text x="964" y="280" fill="#656079" font-size="12">Package + rerun notes</text><rect x="44" y="343" width="1112" height="44" rx="12" fill="#e6e0f1"/><text x="600" y="371" text-anchor="middle" fill="#4b4164" font-size="15">VERIFIED  /  FAILED  /  ASSUMED  /  UNTESTED  /  BLOCKED — keep the distinctions visible.</text><text x="44" y="416" fill="#80758f" font-size="12">CONCEPTUAL WORKFLOW · EXAMPLE PLANS ARE NOT COMPLETED DEMONSTRATIONS</text></g></svg>